<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lexicon of Sounds</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d0d0d;
  color: #f4f4f0;
  font-family: Futura, "Futura PT", "Avenir Next", Arial, sans-serif;
}

.app {
  width: min(1120px, 92%);
  margin: 0 auto;
  padding: 48px 0;
}


/* HEADER */

.hero {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 40px;
  align-items: start;
  margin-bottom: 50px;
}

h1 {
  margin: 0;
  font-size: clamp(42px, 8vw, 88px);
  line-height: 0.88;
  letter-spacing: -0.05em;
  text-transform: uppercase;
}

.subtitle {
  margin-top: 20px;
  color: #888;
  font-size: 12px;
  letter-spacing: 0.13em;
  line-height: 1.6;
  text-transform: uppercase;
}


/* PHOTO */

.photo-container {
  border: 1px solid #333;
  padding: 8px;
}

.photo {
  display: block;
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: cover;
  filter: grayscale(100%);
}


/* GENERATE */

.controls {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 45px;
}

button {
  padding: 16px 28px;

  border: 1px solid #eee;

  background: transparent;
  color: #eee;

  font-family: inherit;
  font-size: 12px;

  letter-spacing: 0.15em;
  text-transform: uppercase;

  cursor: pointer;
}

button:hover {
  background: #eee;
  color: #111;
}


/* TWO HANDS */

.results {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 35px;
}

.hand {
  border-top: 1px solid #444;
  padding-top: 20px;
}

.hand-title {
  margin-bottom: 32px;

  color: #888;

  font-size: 11px;

  letter-spacing: 0.2em;
  text-transform: uppercase;
}


/* PARAMETERS */

.parameter {
  margin-bottom: 30px;
}

.label {
  margin-bottom: 7px;

  color: #666;

  font-size: 10px;

  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.value {
  font-size: clamp(21px, 3vw, 35px);

  line-height: 1.1;

  letter-spacing: -0.025em;

  text-transform: uppercase;
}

.mode {
  font-size: clamp(30px, 4vw, 46px);
}


/* TOOL RELATION */

.tool-relation {
  display: flex;
  flex-wrap: wrap;

  align-items: center;

  gap: 10px;
}

.tool-item {
  display: inline-flex;

  align-items: center;

  gap: 10px;
}

.on {
  color: #666;

  font-size: 10px;

  letter-spacing: 0.15em;
}


/* ICONS */

.tool-icon {

  width: 42px;
  height: 42px;

  flex-shrink: 0;

}

.tool-icon svg {

  width: 100%;
  height: 100%;

  fill: none;

  stroke: #f4f4f0;

  stroke-width: 1.6;

  stroke-linecap: round;
  stroke-linejoin: round;

}


/* ACTION */

.action {

  margin-top: 35px;

  padding: 22px;

  border: 1px solid #333;

}

.action-label {

  margin-bottom: 17px;

  color: #666;

  font-size: 10px;

  letter-spacing: 0.18em;

  text-transform: uppercase;

}

.action-chain {

  display: flex;

  flex-wrap: wrap;

  align-items: center;

  gap: 9px;

  font-size: clamp(15px, 2vw, 21px);

  line-height: 1.5;

  text-transform: uppercase;

}

.action-chain .tool-icon {

  width: 30px;
  height: 30px;

}

.arrow {

  color: #555;

}


/* GLOBAL MUTE */

.global-state {

  margin-top: 55px;

  padding: 25px 0;

  border-top: 1px solid #eee;
  border-bottom: 1px solid #eee;

}

.global-state-label {

  margin-bottom: 10px;

  color: #777;

  font-size: 10px;

  letter-spacing: 0.18em;

  text-transform: uppercase;

}

.global-state-value {

  font-size: clamp(40px, 7vw, 76px);

  line-height: 1;

  letter-spacing: -0.04em;

  text-transform: uppercase;

}


/* FOOTER */

.footer {

  margin-top: 45px;

  color: #505050;

  font-size: 10px;

  letter-spacing: 0.14em;

  text-transform: uppercase;

}


/* MOBILE */

@media (max-width: 760px) {

  .hero {
    grid-template-columns: 1fr;
  }

  .photo-container {
    width: 230px;
  }

  .results {
    grid-template-columns: 1fr;
  }

  button {
    width: 100%;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- HEADER -->

<div class="hero">

  <div>

    <h1>
      Lexicon<br>
      of Sounds
    </h1>

    <div class="subtitle">

      Generative system for solo electric bass by Théo Zipper

    </div>

  </div>


  <div class="photo-container">

    <img
      class="photo"
      src="photo.jpg"
      alt="Théo Zipper"
    >

  </div>

</div>



<!-- GENERATE -->

<div class="controls">

  <button id="generate">
    Generate
  </button>

</div>



<!-- HANDS -->

<div
  id="results"
  class="results"
>
</div>



<!-- GLOBAL STATE -->

<div class="global-state">

  <div class="global-state-label">

    Instrument State

  </div>

  <div
    id="globalMuteState"
    class="global-state-value"
  >
  </div>

</div>



<div class="footer">

  Two Hands × Playing Modes × Tool Interactions × Playing Areas × Instrument State

</div>


</div>



<script>


// ==========================================
// PLAYING AREAS
// ==========================================

const playingAreas = [

  "Pickups",

  "Neck",

  "Head",

  "Body",

  "Off-instrument"

];



// ==========================================
// PLAYING MODES
// ==========================================

const playModes = [

  "Hit",

  "Scratch",

  "Rub"

];



// ==========================================
// TOOLS
// ==========================================

const externalTools = [

  "Tambourine",

  "Lid",

  "Bowl",

  "CD",

  "Ruler",

  "Stick",

  "Chain",

  "Screw"

];



// ==========================================
// SINGLE TOOL POSSIBILITIES
// ==========================================
//
// Fingers only appears when acting
// directly on the strings.
//

const singleTools = [

  ...externalTools,

  "Fingers"

];



// ==========================================
// INSTRUMENT STATE
// ==========================================

const instrumentStates = [

  "Muted",

  "Unmuted"

];



// ==========================================
// SETTINGS
// ==========================================
//
// Probability of TWO tools interacting
//

const twoToolProbability = 0.70;



// ==========================================
// RANDOM
// ==========================================

function random(array) {

  return array[
    Math.floor(
      Math.random() * array.length
    )
  ];

}



// ==========================================
// TOOL ICONS
// ==========================================

function iconSVG(tool) {


  const icons = {


    "Tambourine": `

      <ellipse
        cx="24"
        cy="24"
        rx="16"
        ry="12"
      />

      <ellipse
        cx="24"
        cy="24"
        rx="11"
        ry="8"
      />

      <circle cx="8" cy="20" r="2"/>
      <circle cx="9" cy="29" r="2"/>

      <circle cx="40" cy="20" r="2"/>
      <circle cx="39" cy="29" r="2"/>

    `,


    "Lid": `

      <ellipse
        cx="24"
        cy="28"
        rx="16"
        ry="8"
      />

      <path
        d="M8 28
        C10 18 16 14 24 14
        C32 14 38 18 40 28"
      />

      <path d="M21 13h6"/>

      <path d="M22 10h4"/>

    `,


    "Bowl": `

      <path
        d="M8 18
        H40
        C38 31 32 37 24 37
        C16 37 10 31 8 18Z"
      />

      <path
        d="M11 18
        C14 15 34 15 37 18"
      />

    `,


    "CD": `

      <circle
        cx="24"
        cy="24"
        r="16"
      />

      <circle
        cx="24"
        cy="24"
        r="4"
      />

      <path d="M28 12l-2 8"/>

      <path d="M35 18l-7 4"/>

    `,


    "Ruler": `

      <path
        d="M7 31
        L34 10
        L41 17
        L14 38Z"
      />

      <path d="M30 14l4 4"/>

      <path d="M25 18l3 3"/>

      <path d="M20 22l4 4"/>

      <path d="M15 26l3 3"/>

    `,


    "Stick": `

      <path
        d="M10 38
        L36 12"
      />

      <path
        d="M34 10
        C36 8 39 11 37 13
        L12 39
        C10 41 7 38 9 36Z"
      />

    `,


    "Chain": `

      <path
        d="M13 28
        L10 31
        A6 6 0 0 0 18 39
        L24 33
        A6 6 0 0 0 24 25"
      />

      <path
        d="M35 20
        L38 17
        A6 6 0 0 0 30 9
        L24 15
        A6 6 0 0 0 24 23"
      />

      <path
        d="M19 29
        L29 19"
      />

    `,


    "Screw": `

      <path
        d="M20 8
        H28
        V16
        H20Z"
      />

      <path d="M18 12h12"/>

      <path d="M24 16v24"/>

      <path d="M20 22h8"/>

      <path d="M20 27h8"/>

      <path d="M20 32h8"/>

      <path d="M20 37h8"/>

    `,


    "Fingers": `

      <path
        d="M14 38
        V23
        C14 20 18 20 18 23
        V30"
      />

      <path
        d="M18 30
        V16
        C18 13 22 13 22 16
        V30"
      />

      <path
        d="M22 30
        V13
        C22 10 26 10 26 13
        V30"
      />

      <path
        d="M26 30
        V17
        C26 14 30 14 30 17
        V33"
      />

      <path
        d="M30 27
        L33 23
        C35 21 38 23 37 26
        L32 37
        C30 41 26 43 21 43
        C17 43 14 41 14 38"
      />

    `

  };


  return `

    <span
      class="tool-icon"
      aria-hidden="true"
    >

      <svg
        viewBox="0 0 48 48"
      >

        ${icons[tool] || ""}

      </svg>

    </span>

  `;

}



// ==========================================
// TOOL DISPLAY
// ==========================================

function toolItem(tool) {

  return `

    <span class="tool-item">

      ${iconSVG(tool)}

      <span>
        ${tool}
      </span>

    </span>

  `;

}



// ==========================================
// GENERATE TOOL INTERACTION
// ==========================================

function generateToolInteraction() {


  const useTwoTools =
    Math.random() < twoToolProbability;



  // ----------------------------------------
  // ONE TOOL
  //
  // A single tool always acts
  // directly ON STRINGS.
  //
  // Fingers can appear here.
  // ----------------------------------------

  if (!useTwoTools) {

    return {

      actingTool:
        random(singleTools),

      receivingTool:
        "Strings",

      directOnStrings:
        true

    };

  }



  // ----------------------------------------
  // TWO TOOLS
  //
  // Direction matters:
  //
  // CHAIN ON TAMBOURINE
  //
  // is different from
  //
  // TAMBOURINE ON CHAIN
  // ----------------------------------------

  let actingTool;

  let receivingTool;


  do {

    actingTool =
      random(externalTools);


    receivingTool =
      random(externalTools);

  }

  while (
    actingTool === receivingTool
  );


  return {

    actingTool,

    receivingTool,

    directOnStrings:
      false

  };

}



// ==========================================
// GENERATE HAND
// ==========================================

function generateHand(handName) {


  const interaction =
    generateToolInteraction();


  return {

    handName:

      handName,


    mode:

      random(playModes),


    playingArea:

      random(playingAreas),


    actingTool:

      interaction.actingTool,


    receivingTool:

      interaction.receivingTool,


    directOnStrings:

      interaction.directOnStrings

  };

}



// ==========================================
// INTERACTION DISPLAY
// ==========================================

function interactionHTML(hand) {


  // ONE TOOL ON STRINGS

  if (hand.directOnStrings) {

    return `

      <div class="tool-relation">

        ${toolItem(
          hand.actingTool
        )}

        <span class="on">

          ON STRINGS

        </span>

      </div>

    `;

  }



  // TWO TOOLS

  return `

    <div class="tool-relation">

      ${toolItem(
        hand.actingTool
      )}

      <span class="on">

        ON

      </span>

      ${toolItem(
        hand.receivingTool
      )}

    </div>

  `;

}



// ==========================================
// COMPACT ACTION DISPLAY
// ==========================================

function compactInteractionHTML(hand) {


  if (hand.directOnStrings) {

    return `

      ${toolItem(
        hand.actingTool
      )}

      <span class="on">

        ON STRINGS

      </span>

    `;

  }


  return `

    ${toolItem(
      hand.actingTool
    )}

    <span class="on">

      ON

    </span>

    ${toolItem(
      hand.receivingTool
    )}

  `;

}



// ==========================================
// HAND HTML
// ==========================================

function handHTML(hand) {


  return `

    <section class="hand">


      <div class="hand-title">

        ${hand.handName}

      </div>



      <!-- PLAYING MODE -->

      <div class="parameter">

        <div class="label">

          Playing Mode

        </div>

        <div class="value mode">

          ${hand.mode}

        </div>

      </div>



      <!-- TOOL INTERACTION -->

      <div class="parameter">

        <div class="label">

          Tool Interaction

        </div>

        <div class="value">

          ${interactionHTML(hand)}

        </div>

      </div>



      <!-- PLAYING AREA -->

      <div class="parameter">

        <div class="label">

          Playing Area

        </div>

        <div class="value">

          ${hand.playingArea}

        </div>

      </div>



      <!-- COMPLETE ACTION -->

      <div class="action">

        <div class="action-label">

          Action

        </div>


        <div class="action-chain">


          <span>

            ${hand.mode}

          </span>


          <span class="arrow">

            →

          </span>


          ${compactInteractionHTML(
            hand
          )}


          <span class="arrow">

            →

          </span>


          <span>

            ${hand.playingArea}

          </span>


        </div>

      </div>


    </section>

  `;

}



// ==========================================
// GENERATE
// ==========================================

function generate() {


  // TWO HANDS ARE ALWAYS ACTIVE

  const leftHand =
    generateHand(
      "Left Hand"
    );


  const rightHand =
    generateHand(
      "Right Hand"
    );



  document.getElementById(
    "results"
  ).innerHTML =

    handHTML(
      leftHand
    )

    +

    handHTML(
      rightHand
    );



  // ONE GLOBAL MUTE STATE
  // FOR THE WHOLE INSTRUMENT

  document.getElementById(
    "globalMuteState"
  ).textContent =

    random(
      instrumentStates
    );

}



// ==========================================
// GENERATE BUTTON
// ==========================================

document
  .getElementById(
    "generate"
  )
  .addEventListener(
    "click",
    generate
  );



// ==========================================
// FIRST GENERATION
// ==========================================

generate();


</script>

</body>
</html>
