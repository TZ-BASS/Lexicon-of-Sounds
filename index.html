<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lexicon of Sounds</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0d0d0d;
      color: #f4f4f0;
      font-family: Futura, "Futura PT", "Avenir Next", Arial, sans-serif;
    }

    .app {
      width: min(1050px, 90%);
      margin: 0 auto;
      padding: 60px 0 45px;
    }

    /* =========================
       HEADER
       ========================= */

    h1 {
      margin: 0;
      font-size: clamp(40px, 8vw, 82px);
      line-height: 0.9;
      letter-spacing: -0.045em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 18px;
      margin-bottom: 55px;
      color: #777;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* =========================
       CONTROLS
       ========================= */

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 50px;
    }

    button {
      min-height: 46px;
      padding: 0 20px;

      border: 1px solid #444;
      background: transparent;
      color: #eee;

      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;

      cursor: pointer;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease;
    }

    button:hover {
      border-color: #eee;
    }

    button.active {
      background: #eee;
      color: #111;
      border-color: #eee;
    }

    #generate {
      border-color: #eee;
      margin-left: auto;
    }

    #generate:hover {
      background: #eee;
      color: #111;
    }

    /* =========================
       RESULTS
       ========================= */

    .results {
      display: grid;
      grid-template-columns: 1fr;
      gap: 45px;
    }

    .hand {
      border-top: 1px solid #444;
      padding-top: 18px;
      padding-bottom: 10px;
    }

    .hand-title {
      margin-bottom: 35px;
      color: #888;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* =========================
       PARAMETERS
       ========================= */

    .parameter {
      margin-bottom: 30px;
    }

    .label {
      margin-bottom: 7px;
      color: #666;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .value {
      font-size: clamp(22px, 4vw, 38px);
      line-height: 1.08;
      letter-spacing: -0.025em;
      text-transform: uppercase;
    }

    /* =========================
       TOOL INTERACTION
       ========================= */

    .tool-relation {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 9px;
    }

    .on {
      color: #666;
      font-size: 11px;
      letter-spacing: 0.15em;
    }

    /* =========================
       ACTION CHAIN
       ========================= */

    .action {
      margin-top: 38px;
      padding: 25px;
      border: 1px solid #333;
    }

    .action-label {
      margin-bottom: 18px;
      color: #666;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .action-chain {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;

      font-size: clamp(17px, 2.5vw, 25px);
      line-height: 1.4;
      text-transform: uppercase;
    }

    .arrow {
      color: #555;
      font-size: 16px;
    }

    /* =========================
       GLOBAL INSTRUMENT STATE
       ========================= */

    .global-state {
      margin-top: 55px;

      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;

      padding: 25px 0;
    }

    .global-state-label {
      color: #777;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .global-state-value {
      font-size: clamp(38px, 7vw, 72px);
      line-height: 1;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    /* =========================
       FOOTER
       ========================= */

    .footer {
      margin-top: 55px;
      color: #555;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* =========================
       DESKTOP
       ========================= */

    @media (min-width: 760px) {

      .results.two {
        grid-template-columns: 1fr 1fr;
      }

    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {

      .app {
        width: 92%;
        padding-top: 40px;
      }

      .controls {
        margin-bottom: 40px;
      }

      #generate {
        margin-left: 0;
        width: 100%;
        margin-top: 5px;
      }

    }

  </style>
</head>


<body>

<div class="app">

  <!-- =========================
       HEADER
       ========================= -->

  <h1>
    Lexicon<br>
    of Sounds
  </h1>

  <div class="subtitle">
    Generative system for solo electric bass
  </div>


  <!-- =========================
       CONTROLS
       ========================= -->

  <div class="controls">

    <button id="oneHand" class="active">
      One Hand
    </button>

    <button id="twoHands">
      Two Hands
    </button>

    <button id="generate">
      Generate
    </button>

  </div>


  <!-- =========================
       HAND RESULTS
       ========================= -->

  <div id="results" class="results"></div>


  <!-- =========================
       GLOBAL INSTRUMENT STATE
       ========================= -->

  <div class="global-state">

    <div class="global-state-label">
      Instrument State
    </div>

    <div
      id="globalMuteState"
      class="global-state-value"
    >
    </div>

  </div>


  <!-- =========================
       FOOTER
       ========================= -->

  <div class="footer">
    Tools × Playing Areas × Instrument State
  </div>

</div>



<script>

//
// ========================================
// PLAYING AREAS
// ========================================
//

const playingAreas = [

  "Pickups",

  "Neck",

  "Headstock",

  "Body",

  "Off-instrument"

];


//
// ========================================
// TOOLS
// ========================================
//
// Only external tools are included
// at this stage.
//

const tools = [

  "Tambourine",

  "Lid",

  "Bowl",

  "CD",

  "Ruler",

  "Drumstick",

  "Chain",

  "Screw"

];


//
// ========================================
// GLOBAL INSTRUMENT STATES
// ========================================
//
// This state applies to the WHOLE instrument,
// not to an individual hand.
//

const instrumentStates = [

  "Muted",

  "Unmuted"

];


//
// ========================================
// SETTINGS
// ========================================
//

let numberOfHands = 1;


// Probability that a hand uses
// TWO tools instead of one.
//
// 0.70 = 70%
//

const twoToolProbability = 0.70;


//
// ========================================
// RANDOM FUNCTION
// ========================================
//

function random(array) {

  return array[
    Math.floor(
      Math.random() * array.length
    )
  ];

}


//
// ========================================
// TOOL INTERACTION GENERATOR
// ========================================
//

function generateToolInteraction() {

  const useTwoTools =
    Math.random() < twoToolProbability;


  //
  // ONE TOOL
  //

  if (!useTwoTools) {

    return {

      actingTool:
        random(tools),

      receivingTool:
        null

    };

  }


  //
  // TWO TOOLS
  //
  // The ORDER is important.
  //
  // Example:
  //
  // DRUMSTICK ON LID
  //
  // is a different action from:
  //
  // LID ON DRUMSTICK
  //

  let actingTool;
  let receivingTool;


  do {

    actingTool =
      random(tools);

    receivingTool =
      random(tools);

  }

  while (
    actingTool === receivingTool
  );


  return {

    actingTool,

    receivingTool

  };

}


//
// ========================================
// HAND GENERATOR
// ========================================
//

function generateHand(handName) {

  const interaction =
    generateToolInteraction();


  return {

    handName:

      handName,


    playingArea:

      random(playingAreas),


    actingTool:

      interaction.actingTool,


    receivingTool:

      interaction.receivingTool

  };

}


//
// ========================================
// TOOL DISPLAY
// ========================================
//

function toolHTML(hand) {

  //
  // TWO TOOLS
  //

  if (hand.receivingTool) {

    return `

      <div class="tool-relation">

        <span>
          ${hand.actingTool}
        </span>

        <span class="on">
          ON
        </span>

        <span>
          ${hand.receivingTool}
        </span>

      </div>

    `;

  }


  //
  // ONE TOOL
  //

  return `

    <span>
      ${hand.actingTool}
    </span>

  `;

}


//
// ========================================
// HAND DISPLAY
// ========================================
//

function handHTML(hand) {

  const toolsDisplay =
    toolHTML(hand);


  return `

    <div class="hand">


      <!-- HAND -->

      <div class="hand-title">

        ${hand.handName}

      </div>


      <!-- TOOL -->

      <div class="parameter">

        <div class="label">
          Tool
        </div>

        <div class="value">

          ${toolsDisplay}

        </div>

      </div>


      <!-- PLAYING AREA -->

      <div class="parameter">

        <div class="label">
          Playing Area
        </div>

        <div class="value">

          ${hand.playingArea}

        </div>

      </div>


      <!-- ACTION -->

      <div class="action">

        <div class="action-label">
          Action
        </div>


        <div class="action-chain">

          <span>

            ${toolsDisplay}

          </span>


          <span class="arrow">
            →
          </span>


          <span>

            ${hand.playingArea}

          </span>

        </div>

      </div>


    </div>

  `;

}


//
// ========================================
// GENERATE COMPLETE CONFIGURATION
// ========================================
//

function generate() {

  const results =
    document.getElementById(
      "results"
    );


  //
  // GENERATE GLOBAL INSTRUMENT STATE
  //
  // Only ONE state is generated.
  //
  // In Two Hands mode,
  // BOTH hands share this state.
  //

  const globalState =
    random(instrumentStates);


  document.getElementById(
    "globalMuteState"
  ).textContent =
    globalState;


  //
  // ONE HAND MODE
  //

  if (numberOfHands === 1) {

    results.classList.remove(
      "two"
    );


    const leftHand =
      generateHand(
        "Left Hand"
      );


    results.innerHTML =
      handHTML(
        leftHand
      );

  }


  //
  // TWO HANDS MODE
  //

  else {

    results.classList.add(
      "two"
    );


    //
    // Each hand is generated
    // independently.
    //
    // Therefore each hand can:
    //
    // - use different tools
    // - use one or two tools
    // - play on a different area
    //

    const leftHand =
      generateHand(
        "Left Hand"
      );


    const rightHand =
      generateHand(
        "Right Hand"
      );


    results.innerHTML =

      handHTML(
        leftHand
      )

      +

      handHTML(
        rightHand
      );

  }

}


//
// ========================================
// BUTTONS
// ========================================
//

const oneHandButton =
  document.getElementById(
    "oneHand"
  );


const twoHandsButton =
  document.getElementById(
    "twoHands"
  );


const generateButton =
  document.getElementById(
    "generate"
  );


//
// ========================================
// ONE HAND BUTTON
// ========================================
//

oneHandButton.addEventListener(

  "click",

  function () {

    numberOfHands = 1;


    oneHandButton.classList.add(
      "active"
    );


    twoHandsButton.classList.remove(
      "active"
    );


    generate();

  }

);


//
// ========================================
// TWO HANDS BUTTON
// ========================================
//

twoHandsButton.addEventListener(

  "click",

  function () {

    numberOfHands = 2;


    twoHandsButton.classList.add(
      "active"
    );


    oneHandButton.classList.remove(
      "active"
    );


    generate();

  }

);


//
// ========================================
// GENERATE BUTTON
// ========================================
//

generateButton.addEventListener(

  "click",

  generate

);


//
// ========================================
// INITIAL GENERATION
// ========================================
//

generate();


</script>

</body>
</html>
